<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Projection - Tableau</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/ui.css">
  <link rel="stylesheet" href="../shared/responsive.css">
  <link rel="stylesheet" href="../student/css/student.css">
  <link rel="stylesheet" href="../student/css/student-core.css">
  <link rel="stylesheet" href="./css/teacher-tools-projector.css">
</head>
<body>
  <main class="ttp-shell">
    <section id="teacherToolsProjectorStage" class="ttp-stage" data-background="white">
      <div id="teacherToolsProjectorStarfield" class="ttp-space-starfield" aria-hidden="true" hidden></div>
      <div id="teacherToolsAppHost" class="ttp-app-host" aria-live="polite"></div>
      <canvas id="teacherToolsAnnotationLayer" class="ttp-annotation-layer" aria-hidden="true"></canvas>

      <button id="btnTeacherToolsChromeToggle" class="ttp-chrome-toggle" type="button" aria-pressed="false" aria-label="Masquer les commandes" title="Masquer les commandes">
        <span class="ttp-material-icon" aria-hidden="true">visibility</span>
      </button>

      <div id="teacherToolsLaunchOverlay" class="ttp-launch-overlay" role="dialog" aria-modal="true" aria-label="Passer en plein écran">
        <div class="ttp-launch-card">
          <img class="ttp-launch-rocket" src="../shared/ui-assets/rocket.svg" alt="" aria-hidden="true">
          <button id="btnTeacherToolsLaunch" class="ttp-launch-button" type="button">
            <span class="ttp-material-icon" aria-hidden="true">fullscreen</span>
            <span>Plein écran</span>
          </button>
        </div>
      </div>

      <nav class="ttp-page-rail" aria-label="Commandes du Tableau">
        <button id="btnTeacherToolsPageMenu" class="ttp-page-rail-btn" type="button" aria-expanded="false" aria-label="Changer de page" title="Pages"><span class="ttp-material-icon" aria-hidden="true">apps</span></button>
        <button id="btnTeacherToolsAppControls" class="ttp-page-rail-btn" type="button" aria-expanded="false" aria-label="Commandes de l’application" title="Commandes"><span class="ttp-material-icon" aria-hidden="true">tune</span></button>
      </nav>

      <aside id="teacherToolsPageDrawer" class="ttp-page-drawer" hidden aria-label="Pages du Tableau">
        <div class="ttp-page-drawer-head"><strong>Pages</strong><button id="btnTeacherToolsPageDrawerClose" class="ttp-page-drawer-close" type="button" aria-label="Fermer"><span class="ttp-material-icon">close</span></button></div>
        <div id="teacherToolsPageList" class="ttp-page-list"></div>
        <div class="ttp-page-drawer-actions">
          <button id="btnTeacherToolsPageAdd" class="ttp-page-drawer-action is-add" type="button"><span class="ttp-material-icon">add</span><span>Ajouter une page</span></button>
          <button id="btnTeacherToolsPageFullscreen" class="ttp-page-drawer-action" type="button"><span class="ttp-material-icon">fullscreen</span><span>Plein écran</span></button>
          <button id="btnTeacherToolsPageClose" class="ttp-page-drawer-action is-danger" type="button"><span class="ttp-material-icon">close</span><span>Fermer la projection</span></button>
        </div>
      </aside>

      <div id="teacherToolsAppCatalog" class="ttp-catalog-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="teacherToolsAppCatalogTitle">
        <section class="ttp-catalog-card">
          <div class="ttp-catalog-head">
            <strong id="teacherToolsAppCatalogTitle">Ajouter une page</strong>
            <button id="btnTeacherToolsAppCatalogClose" class="ttp-catalog-close" type="button" aria-label="Fermer"><span class="ttp-material-icon">close</span></button>
          </div>
          <div id="teacherToolsAppCatalogGrid" class="ttp-catalog-grid"></div>
        </section>
      </div>

      <aside id="teacherToolsAppControls" class="ttp-app-controls" hidden aria-label="Commandes de l’application">
        <div class="ttp-app-controls-head"><strong id="teacherToolsAppControlsTitle">Application</strong><button id="btnTeacherToolsAppControlsClose" type="button" aria-label="Masquer"><span class="ttp-material-icon">close</span></button></div>
        <div id="teacherToolsAppControlsContent" class="ttp-app-controls-content"></div>
      </aside>

      <div id="teacherToolsQuickActions" class="ttp-quick-actions" hidden aria-label="Actions rapides"></div>
      <div id="teacherToolsAnnotationToolbar" class="ttp-note-toolbar" aria-label="Notes"></div>
    </section>
  </main>
  <script type="module" src="./js/teacher-tools/projector-app.js"></script>
</body>
</html>
